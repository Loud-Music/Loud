name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      platform:
        description: Build platforms
        type: choice
        options: [all, windows, linux]
        default: all
      publish:
        description: Publish packages to GitHub Releases
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  windows:
    if: ${{ inputs.platform != 'linux' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Check version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne "v$version") { throw "Tag does not match package version" }
      - run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - run: node scripts/update-manifest.mjs
      - name: Publish
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$version"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create $tag --draft --target "${{ github.sha }}" --title "Loud $version" --generate-notes }
          gh release upload $tag src-tauri/target/release/bundle/nsis/*.exe src-tauri/target/release/bundle/nsis/*.sig src-tauri/target/release/bundle/nsis/latest.json src-tauri/target/release/bundle/nsis/SHA256SUMS.txt --clobber
          if ($LASTEXITCODE -ne 0) { throw "Release upload failed" }
          gh release edit $tag --draft=false --latest
  linux:
    needs: windows
    if: ${{ always() && !cancelled() && (needs.windows.result == 'success' || needs.windows.result == 'skipped') && inputs.platform != 'windows' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache/restore@v4
        id: rust-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: linux-release-${{ hashFiles('src-tauri/Cargo.lock') }}
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 xvfb gstreamer1.0-tools gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav libnss3 libnspr4 libgbm1 libasound2
      - run: npm ci
      - name: Build packages
        run: npm run tauri build -- --bundles deb,appimage
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/cache/save@v4
        if: ${{ always() && steps.rust-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: linux-release-${{ hashFiles('src-tauri/Cargo.lock') }}
      - name: Verify first launch and media tools
        run: |
          export LOUD_PROFILE_DIR="$(mktemp -d)"
          printf 'Loud profile\n' > "$LOUD_PROFILE_DIR/.loud-profile"
          mkdir -p "$LOUD_PROFILE_DIR/user-data"
          node --input-type=module -e 'import {writeFileSync} from "node:fs"; writeFileSync(process.env.LOUD_PROFILE_DIR+"/user-data/settings.json", JSON.stringify({"loud:accounts:v1":JSON.stringify([{id:"legacy",name:"Linux build",created:Date.now()}]),"loud:last-account":"legacy"}));'
          xvfb-run -a bash -e -c '
            src-tauri/target/release/bundle/appimage/*.AppImage > "$LOUD_PROFILE_DIR/startup.log" 2>&1 &
            app_pid=$!
            trap "kill $app_pid 2>/dev/null || true" EXIT
            for i in $(seq 1 240); do
              kill -0 "$app_pid" || { cat "$LOUD_PROFILE_DIR/startup.log"; exit 1; }
              if [ -f "$LOUD_PROFILE_DIR/tools/music-module/music-runtime-v2.ready" ] && [ -x "$LOUD_PROFILE_DIR/tools/ffmpeg-8.1/yt-dlp" ] && [ -x "$LOUD_PROFILE_DIR/tools/ffmpeg-8.1/ffprobe" ]; then break; fi
              sleep 1
            done
            if [ ! -f "$LOUD_PROFILE_DIR/tools/music-module/music-runtime-v2.ready" ]; then
              cat "$LOUD_PROFILE_DIR/startup.log"
              cat "$LOUD_PROFILE_DIR/logs/playback.log" 2>/dev/null || true
              exit 1
            fi
            "$LOUD_PROFILE_DIR/tools/ffmpeg-8.1/ffmpeg" -version
            "$LOUD_PROFILE_DIR/tools/ffmpeg-8.1/ffprobe" -version
            "$LOUD_PROFILE_DIR/tools/ffmpeg-8.1/yt-dlp" --version
            "$LOUD_PROFILE_DIR/tools/music-module/env/bin/python3" -c "from importlib.metadata import version; assert version(\"spotiflac\") == \"5.0.5\"; import SpotiFLAC, json5, playwright.sync_api"
          '
          src-tauri/target/release/bundle/appimage/*.AppImage --appimage-extract >/dev/null
          test -x squashfs-root/AppRun
          status=0
          xvfb-run -a timeout 15s squashfs-root/AppRun > "$LOUD_PROFILE_DIR/appimage.log" 2>&1 || status=$?
          if [ "$status" -ne 124 ]; then cat "$LOUD_PROFILE_DIR/appimage.log"; exit 1; fi
          dpkg-deb --info src-tauri/target/release/bundle/deb/*.deb
          gst-inspect-1.0 flacdec
          gst-inspect-1.0 avdec_aac
          gst-inspect-1.0 mpg123audiodec
      - name: Save Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: Loud-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.sig
          if-no-files-found: error
      - name: Publish Linux packages
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p 'require("./package.json").version')
          mkdir -p .release/linux
          git archive --format=tar.gz --prefix="Loud-$version/" HEAD > ".release/linux/Loud-$version-linux-source.tar.gz"
          gh release download "v$version" --pattern latest.json --dir .release/linux
          gh release download "v$version" --pattern SHA256SUMS.txt --dir .release/linux
          node scripts/linux-manifest.mjs
          gh release upload "v$version" src-tauri/target/release/bundle/deb/*.deb src-tauri/target/release/bundle/appimage/*.AppImage src-tauri/target/release/bundle/appimage/*.sig ".release/linux/Loud-$version-linux-source.tar.gz" .release/linux/SHA256SUMS-linux.txt --clobber
          gh release upload "v$version" .release/linux/latest.json .release/linux/SHA256SUMS.txt --clobber
